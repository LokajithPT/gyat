[workspace]
members = ["server", "bundle"]
resolver = "2"

[package]
name = "gyat"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
walkdir = "2"
glob = "0.3"
flate2 = "1"
gyat-bundle = { path = "bundle" }
